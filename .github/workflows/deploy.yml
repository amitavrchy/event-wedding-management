name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/amitavrchy/utsab-backend
  FRONTEND_IMAGE: ghcr.io/amitavrchy/utsab-frontend
  APP_DIR: /opt/apps/utsab
  # Frontend build-time values
  API_URL: http://utsab-backend:4003
  NEXT_PUBLIC_SOCKET_URL: https://api.utsab.13.203.3.1.sslip.io

jobs:
  verify:
    # Deploys only run on a commit that passes the full test suite.
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:latest
            ${{ matrix.name == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            API_URL=${{ env.API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.NEXT_PUBLIC_SOCKET_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare app directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -e
            sudo mkdir -p "$APP_DIR"
            sudo chown "$(id -u):$(id -g)" "$APP_DIR"

      - name: Copy compose file and deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/scripts/*
          target: ${{ env.APP_DIR }}/.incoming
          strip_components: 1

      - name: Backup, migrate, release, health check (rollback on failure)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            mv -f .incoming/docker-compose.prod.yml docker-compose.yml
            mkdir -p scripts && mv -f .incoming/scripts/* scripts/ && chmod +x scripts/*.sh
            rm -rf .incoming
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" ./scripts/release.sh
            docker logout ghcr.io || true
            docker image prune -f
