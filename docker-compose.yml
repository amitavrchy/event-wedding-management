services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: utsab
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: utsab
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utsab"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  postgres_data:
  redis_data:
