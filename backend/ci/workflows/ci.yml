name: Verify Utsab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  product-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: utsab
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: utsab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U utsab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://utsab:ci-password@localhost:5432/utsab_test
      TEST_DATABASE_URL: postgresql://utsab:ci-password@localhost:5432/utsab_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      WEBHOOK_SECRET: ci-only-separate-webhook-secret
      PAYMENT_MODE: sandbox
      CORS_ORIGINS: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build && npm --prefix ../frontend run build
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production servers
        run: |
          npm run start > /tmp/utsab-api.log 2>&1 &
          npm --prefix ../frontend run start > /tmp/utsab-web.log 2>&1 &
          node scripts/wait-for.mjs http://localhost:4000/api/health http://localhost:3000
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            frontend/artifacts/
            frontend/test-results/
          retention-days: 7
