# Production stack for Utsab on the shared EC2 host.
# Deployed by .github/workflows/deploy.yml to /opt/apps/utsab/docker-compose.yml.
# Runtime env comes from /opt/apps/utsab/.env (see deploy/.env.example). Never commit real secrets.
# Requires the external network `apps-net` and the `shared-postgres` container on it.
name: utsab

services:
  backend:
    image: ghcr.io/amitavrchy/utsab-backend:${IMAGE_TAG:-latest}
    container_name: utsab-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4003"
      NODE_OPTIONS: --max-old-space-size=320
      RUN_WORKER: "false"
      REDIS_URL: redis://utsab-redis:6379
    ports:
      - "127.0.0.1:4003:4003"
    depends_on:
      - redis
    mem_limit: 448m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4003/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [apps-net]

  worker:
    # Background jobs: hold/quote expiry, reminders, automations, notification delivery.
    image: ghcr.io/amitavrchy/utsab-backend:${IMAGE_TAG:-latest}
    container_name: utsab-worker
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://utsab-redis:6379
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      - redis
    mem_limit: 320m
    healthcheck:
      # The worker touches this file after every successful maintenance run.
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging: *logging
    networks: [apps-net]

  redis:
    image: redis:7-alpine
    container_name: utsab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    networks: [apps-net]

  frontend:
    image: ghcr.io/amitavrchy/utsab-frontend:${IMAGE_TAG:-latest}
    container_name: utsab-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3003"
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:3003:3003"
    mem_limit: 384m
    memswap_limit: 640m
    depends_on:
      - backend
    logging: *logging
    networks: [apps-net]

volumes:
  redis-data:

networks:
  apps-net:
    external: true
